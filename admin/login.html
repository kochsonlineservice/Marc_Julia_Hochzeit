
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login – Marc & Julia</title>

    <link rel="stylesheet" href="./admin.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="login-herz">♥</div>

            <h1>Marc & Julia</h1>

            <p class="login-untertitel">
                Hochzeitsverwaltung
            </p>

            <div class="login-trennlinie"></div>

            <h2>Willkommen zurück, Julia!</h2>

            <p class="login-text">
                Bitte melde dich an, um die Gästeliste
                und Hochzeitsinformationen zu verwalten.
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        E-Mail-Adresse
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Deine E-Mail-Adresse"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Passwort
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Dein Passwort"
                        required
                    >

                </div>

                <p id="loginFehler" class="login-fehler" hidden></p>

                <button type="submit" id="loginButton">
                    Anmelden
                </button>

            </form>

            <p class="login-footer">
                Geschützter Zugang für Julia
            </p>

            <a href="../index.html" class="zurueck-link">
                Zurück zur Hochzeitsseite
            </a>

        </div>

    </main>

    <script src="../js/db.js"></script>
    <script type="module" src="./admin.js"></script>

</body>
</html>
